<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DashDrop - Campus Marketplace</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <header class="navbar">
        <div class="logo">DashDrop</div>

        <nav>
            <a href="items.html">Items</a>
            <a href="rent.html">Rent</a>
            <a href="sell.html">Sell</a>
            <a href="account.html">Account Details</a>
        </nav>

        <button class="login-btn" onclick="goToItems()">
            Login
        </button>
    </header>

    <!-- Main Landing Section -->
    <main class="hero">

        <div class="hero-content">

            <h1>
                Borrow. Rent. Sell.
                <span>Everything in one place.</span>
            </h1>

            <p>
                Find what you need, rent what you want,
                and sell what you no longer use on your campus.
            </p>

            <button class="start-btn" onclick="goToItems()">
                Get Started →
            </button>

        </div>

        <!-- Decorative Boxes -->
        <div class="decoration decoration-1"></div>
        <div class="decoration decoration-2"></div>
        <div class="decoration decoration-3"></div>

    </main>

    <!-- Footer -->
    <footer>
        <p>© 2026 DashDrop | Your campus marketplace</p>
    </footer>

    <!-- Socket.IO client (served automatically by backend) -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>

</html>
